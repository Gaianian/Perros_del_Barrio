<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Perros del Barrio</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.PNG"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/Perros_del_Barrio/css/style.css"
  >


  <!-- Facebook / social preview -->

  <meta property="og:title" content="Perros del Barrio">

  <meta
    property="og:description"
    content="Explora, encuentre y reporte <br>perros comunitarios en Cuenca."
  >

  <meta
    property="og:image"
    content="https://gaianian.github.io/Perros_del_Barrio/Preview.PNG"
  >

  <meta property="og:image:width" content="1200">

  <meta property="og:image:height" content="630">

  <meta
    property="og:url"
    content="https://gaianian.github.io/Perros_del_Barrio/"
  >

  <meta property="og:type" content="website">

  <meta
    name="description"
    content="Encuentre y reporte perros comunitarios en Cuenca."
  >

</head>


<body>


  <!-- =========================
       HEADER
       ========================= -->

  <header class="site-header">


    <!-- LOGO -->

    <div class="logo-area">

      <img
        src="images/Logo.png"
        alt="Logo de Perros del Barrio"
        class="logo"
      >

    </div>


    <!-- TITLE -->

    <div class="header-text">

      <h1>Perros del Barrio</h1>

      <p>
        Explora, encuentre y reporte <br>
        perros comunitarios en Cuenca
      </p>

    </div>


    <!-- =========================
         PAW MENU
         ========================= -->

    <nav
      class="site-menu"
      aria-label="Menú principal"
    >

      <div
        class="paw-menu"
        id="pawMenu"
      >

        <svg
          class="paw-menu-svg"
          viewBox="0 0 320 300"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Menú principal"
        >


          <!-- =========================
               CURVED LABEL PATHS
               Invisible paths used only
               to position curved text
               ========================= -->

          <defs>

            <!-- PARTICIPA -->
            <path
              id="participaPath"
              d="M54 91
                 C68 48 114 41 137 67"
            />

            <!-- DONAR -->
            <path
              id="donarPath"
              d="M178 67
                 C203 41 248 49 263 91"
            />


            <!-- REPORTAR -->
            <path
              id="reportarPath"
              d="M26 141
                 C22 112 38 91 61 82"
            />

            <!-- AVISTAMIENTO -->
            <path
              id="avistamientoPath"
              d="M21 160
                 C18 121 39 91 70 77"
            />


            <!-- SOBRE -->
            <path
              id="sobrePath"
              d="M258 82
                 C282 91 298 112 294 141"
            />

            <!-- NOSOTROS -->
            <path
              id="nosotrosPath"
              d="M249 77
                 C281 91 302 121 299 160"
            />

          </defs>



          <!-- =========================
               PARTICIPA TOE
               ========================= -->

          <a
            href="#"
            class="paw-item paw-participa"
            aria-label="Participa"
          >

            <g class="toe">

              <ellipse
                cx="99"
                cy="104"
                rx="27"
                ry="37"
              />

              <text class="toe-label">

                <textPath
                  href="#participaPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Participa
                </textPath>

              </text>

            </g>

          </a>



          <!-- =========================
               DONAR TOE
               ========================= -->

          <a
            href="#"
            class="paw-item paw-donar"
            aria-label="Donar"
          >

            <g class="toe">

              <ellipse
                cx="216"
                cy="104"
                rx="27"
                ry="37"
              />

              <text class="toe-label">

                <textPath
                  href="#donarPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Donar
                </textPath>

              </text>

            </g>

          </a>



          <!-- =========================
               REPORTAR AVISTAMIENTO TOE
               ========================= -->

          <a
            href="#"
            class="paw-item paw-reportar"
            aria-label="Reportar avistamiento"
          >

            <g class="toe">

              <ellipse
                cx="56"
                cy="162"
                rx="25"
                ry="35"
                transform="rotate(-28 56 162)"
              />


              <text class="toe-label toe-label-small">

                <textPath
                  href="#reportarPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Reportar
                </textPath>

              </text>


              <text class="toe-label toe-label-small">

                <textPath
                  href="#avistamientoPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  avistamiento
                </textPath>

              </text>

            </g>

          </a>



          <!-- =========================
               SOBRE NOSOTROS TOE
               ========================= -->

          <a
            href="#"
            class="paw-item paw-sobre"
            aria-label="Sobre nosotros"
          >

            <g class="toe">

              <ellipse
                cx="264"
                cy="162"
                rx="25"
                ry="35"
                transform="rotate(28 264 162)"
              />


              <text class="toe-label toe-label-small">

                <textPath
                  href="#sobrePath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Sobre
                </textPath>

              </text>


              <text class="toe-label toe-label-small">

                <textPath
                  href="#nosotrosPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  nosotros
                </textPath>

              </text>

            </g>

          </a>



          <!-- =========================
               MAIN PAW PAD
               ========================= -->

          <g
            class="paw-center"
            id="pawMenuButton"
            role="button"
            tabindex="0"
            aria-expanded="false"
            aria-label="Abrir menú"
          >


            <path
              d="
                M91 225
                C92 188 110 158 133 147
                C146 141 173 141 187 147
                C210 158 228 188 229 225
                C230 249 212 261 191 256
                C172 251 148 251 129 256
                C108 261 90 249 91 225
                Z
              "
            />


            <!-- curved menu marks -->

            <g class="paw-lines">

              <path d="M137 190 Q160 182 183 190" />

              <path d="M133 204 Q160 195 187 204" />

              <path d="M138 218 Q160 211 182 218" />

            </g>


            <!-- INICIO INSIDE PAW -->

            <text
              class="paw-home-label"
              x="160"
              y="244"
            >
              Inicio
            </text>

          </g>


        </svg>

      </div>

    </nav>

  </header>



  <!-- =========================
       ARCGIS APPLICATION
       ========================= -->

  <main class="app-container">

    <iframe
      src="https://experience.arcgis.com/experience/e444a62bd78e417292dcc66910450bdf?draft=true&org=GaiaSpatial"
      allow="geolocation"
      title="Aplicación Perros del Barrio"
      allowfullscreen
    >
    </iframe>

  </main>



  <script src="/Perros_del_Barrio/js/paw-menu.js"></script>


</body>

</html>
