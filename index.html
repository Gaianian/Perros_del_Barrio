<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Perros del Barrio</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.PNG"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/Perros_del_Barrio/css/style.css"
  >

  <meta
    property="og:title"
    content="Perros del Barrio"
  >

  <meta
    property="og:description"
    content="Explora, encuentra y reporta perros comunitarios en Cuenca."
  >

  <meta
    property="og:image"
    content="https://gaianian.github.io/Perros_del_Barrio/Preview.PNG"
  >

  <meta
    property="og:image:width"
    content="1200"
  >

  <meta
    property="og:image:height"
    content="630"
  >

  <meta
    property="og:url"
    content="https://gaianian.github.io/Perros_del_Barrio/"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    name="description"
    content="Explora, encuentra y reporta perros comunitarios en Cuenca."
  >
</head>


<body>

  <header class="site-header">

    <div class="header-text">

      <h1>
        Perros del Barrio
      </h1>

      <p>
        Explora, encuentra y reporta
        <br>
        perros comunitarios en Cuenca
      </p>

    </div>


    <nav
      class="site-menu"
      aria-label="Menú principal"
    >

      <div
        class="paw-menu"
        id="pawMenu"
      >

        <svg
          class="paw-menu-svg"
          viewBox="0 0 360 340"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Menú principal"
        >

          <!-- =====================================
               CÓMO USAR
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-como"
            aria-label="Cómo usar"
          >

            <g class="toe">

              <ellipse
                cx="135"
                cy="116"
                rx="30"
                ry="42"
                transform="rotate(-12 135 116)"
              />

              <text
                class="toe-label toe-label-top"
                x="130"
                y="57"
                text-anchor="middle"
                transform="rotate(-10 130 57)"
              >
                Cómo usar
              </text>

            </g>

          </a>


          <!-- =====================================
               PARTICIPA
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-participa"
            aria-label="Participa"
          >

            <g class="toe">

              <ellipse
                cx="225"
                cy="116"
                rx="30"
                ry="42"
                transform="rotate(12 225 116)"
              />

              <text
                class="toe-label toe-label-top"
                x="230"
                y="57"
                text-anchor="middle"
                transform="rotate(10 230 57)"
              >
                Participa
              </text>

            </g>

          </a>


          <!-- =====================================
               REPORTAR AVISTAMIENTO
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-reportar"
            aria-label="Reportar avistamiento"
          >

            <g class="toe">

              <ellipse
                cx="70"
                cy="171"
                rx="29"
                ry="41"
                transform="rotate(-40 70 171)"
              />

              <text
                class="toe-label toe-label-side"
                x="34"
                y="106"
                text-anchor="middle"
                transform="rotate(-38 34 106)"
              >
                Reportar
              </text>

              <text
                class="toe-label toe-label-side-long"
                x="18"
                y="126"
                text-anchor="middle"
                transform="rotate(-38 18 126)"
              >
                avistamiento
              </text>

            </g>

          </a>


          <!-- =====================================
               SOBRE NOSOTROS
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-sobre"
            aria-label="Sobre nosotros"
          >

            <g class="toe">

              <ellipse
                cx="290"
                cy="171"
                rx="29"
                ry="41"
                transform="rotate(40 290 171)"
              />

              <text
                class="toe-label toe-label-side"
                x="326"
                y="106"
                text-anchor="middle"
                transform="rotate(38 326 106)"
              >
                Sobre
              </text>

              <text
                class="toe-label toe-label-side"
                x="340"
                y="127"
                text-anchor="middle"
                transform="rotate(38 340 127)"
              >
                nosotros
              </text>

            </g>

          </a>


          <!-- =====================================
               MAIN PAW PAD
               ===================================== -->

          <g
            class="paw-center"
            id="pawMenuButton"
            role="button"
            tabindex="0"
            aria-expanded="false"
            aria-label="Abrir menú"
          >

            <path
              d="
                M98 244
                C99 197 124 161 152 148
                C168 140 192 140 208 148
                C236 161 261 197 262 244
                C263 273 241 287 216 280
                C194 274 166 274 144 280
                C119 287 97 273 98 244
                Z
              "
            />

            <g class="paw-lines">

              <path
                d="
                  M143 196
                  Q180 183 217 196
                "
              />

              <path
                d="
                  M138 215
                  Q180 200 222 215
                "
              />

              <path
                d="
                  M145 234
                  Q180 222 215 234
                "
              />

            </g>

          </g>


          <!-- =====================================
               INICIO
               ===================================== -->

          <a
            href="index.html"
            class="paw-home-link"
            aria-label="Inicio"
          >

            <text
              class="paw-home-label"
              x="180"
              y="319"
              text-anchor="middle"
            >
              Inicio
            </text>

          </a>

        </svg>

      </div>

    </nav>

  </header>


  <main class="app-container">

    <div class="app-wrapper">

      <div
        class="filter-cue"
        id="filterCue"
        aria-hidden="true"
      >
        <span class="filter-cue-label">
          Filtrar perros
        </span>

        <span class="filter-cue-arrow">
          ↓
        </span>
      </div>


      <iframe
        src="https://experience.arcgis.com/experience/e444a62bd78e417292dcc66910450bdf?draft=true&org=GaiaSpatial"
        allow="geolocation"
        title="Aplicación Perros del Barrio"
        allowfullscreen
      >
      </iframe>

    </div>

  </main>


  <script src="/Perros_del_Barrio/js/paw-menu.js"></script>

</body>

</html>
