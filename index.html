<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Perros del Barrio</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.PNG"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/Perros_del_Barrio/css/style.css"
  >

  <meta
    property="og:title"
    content="Perros del Barrio"
  >

  <meta
    property="og:description"
    content="Explora, encuentra y reporta perros comunitarios en Cuenca."
  >

  <meta
    property="og:image"
    content="https://gaianian.github.io/Perros_del_Barrio/Preview.PNG"
  >

  <meta
    property="og:image:width"
    content="1200"
  >

  <meta
    property="og:image:height"
    content="630"
  >

  <meta
    property="og:url"
    content="https://gaianian.github.io/Perros_del_Barrio/"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    name="description"
    content="Explora, encuentra y reporta perros comunitarios en Cuenca."
  >
</head>


<body>

  <header class="site-header">

    <!-- TAGLINE -->

    <div class="header-tagline">

      <p>
        Explora, encuentra y reporta
        <br>
        perros comunitarios en Cuenca
      </p>

    </div>


    <!-- TITLE -->

    <h1 class="site-title">
      Perros del Barrio
    </h1>


    <!-- PAW MENU -->

    <nav
      class="site-menu"
      aria-label="Menú principal"
    >

      <div
        class="paw-menu"
        id="pawMenu"
      >

        <svg
          class="paw-menu-svg"
          viewBox="0 25 360 275"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Menú principal"
        >

          <defs>

            <!-- Curved one-word labels -->

            <path
              id="ayudaPath"
              d="
                M77 92
                Q123 56 169 92
              "
            />

            <path
              id="participaPath"
              d="
                M191 92
                Q237 56 283 92
              "
            />

            <path
              id="reportaPath"
              d="
                M10 167
                Q53 126 96 160
              "
            />

            <path
              id="nosotrosPath"
              d="
                M264 160
                Q307 126 350 167
              "
            />

          </defs>


          <!-- =====================================
               AYUDA
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-ayuda"
            aria-label="Cómo usar"
          >

            <g class="toe">

              <circle
                cx="123"
                cy="105"
                r="44"
              />

              <text class="toe-word">

                <textPath
                  href="#ayudaPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Ayuda
                </textPath>

              </text>


              <g class="toe-hover-word">

                <text
                  x="123"
                  y="100"
                  text-anchor="middle"
                >
                  Cómo
                </text>

                <text
                  x="123"
                  y="127"
                  text-anchor="middle"
                >
                  usar
                </text>

              </g>

            </g>

          </a>


          <!-- =====================================
               PARTICIPA
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-participa"
            aria-label="Participa aquí"
          >

            <g class="toe">

              <circle
                cx="237"
                cy="105"
                r="44"
              />

              <text class="toe-word">

                <textPath
                  href="#participaPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Participa
                </textPath>

              </text>


              <g class="toe-hover-word">

                <text
                  x="237"
                  y="100"
                  text-anchor="middle"
                >
                  Participa
                </text>

                <text
                  x="237"
                  y="127"
                  text-anchor="middle"
                >
                  aquí
                </text>

              </g>

            </g>

          </a>


          <!-- =====================================
               REPORTA
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-reporta"
            aria-label="Reportar perro"
          >

            <g class="toe">

              <circle
                cx="53"
                cy="175"
                r="44"
              />

              <text class="toe-word">

                <textPath
                  href="#reportaPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Reporta
                </textPath>

              </text>


              <g class="toe-hover-word">

                <text
                  x="53"
                  y="169"
                  text-anchor="middle"
                >
                  Reportar
                </text>

                <text
                  x="53"
                  y="196"
                  text-anchor="middle"
                >
                  perro
                </text>

              </g>

            </g>

          </a>


          <!-- =====================================
               NOSOTROS
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-nosotros"
            aria-label="Sobre nosotros"
          >

            <g class="toe">

              <circle
                cx="307"
                cy="175"
                r="44"
              />

              <text class="toe-word">

                <textPath
                  href="#nosotrosPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Nosotros
                </textPath>

              </text>


              <g class="toe-hover-word">

                <text
                  x="307"
                  y="169"
                  text-anchor="middle"
                >
                  Sobre
                </text>

                <text
                  x="307"
                  y="196"
                  text-anchor="middle"
                >
                  nosotros
                </text>

              </g>

            </g>

          </a>


          <!-- =====================================
               MAIN PAW PAD
               ===================================== -->

          <g
            class="paw-center"
            id="pawMenuButton"
            role="button"
            tabindex="0"
            aria-expanded="false"
            aria-label="Abrir menú"
          >

            <path
              d="
                M95 241
                C96 192 122 154 151 140
                C168 132 192 132 209 140
                C238 154 264 192 265 241
                C266 273 242 289 216 281
                C194 274 166 274 144 281
                C118 289 94 273 95 241
                Z
              "
            />

            <g class="paw-lines">

              <path
                d="
                  M141 190
                  Q180 176 219 190
                "
              />

              <path
                d="
                  M136 211
                  Q180 195 224 211
                "
              />

              <path
                d="
                  M143 232
                  Q180 219 217 232
                "
              />

            </g>


            <!-- ALWAYS VISIBLE -->

            <text
              class="paw-home-label"
              x="180"
              y="265"
              text-anchor="middle"
            >
              Inicio
            </text>

          </g>

        </svg>

      </div>

    </nav>

  </header>


  <main class="app-container">

    <div class="app-wrapper">

      <div
        class="filter-cue"
        aria-hidden="true"
      >

        <span class="filter-cue-label">
          Filtrar perros
        </span>

        <span class="filter-cue-arrow">
          ↓
        </span>

      </div>


      <iframe
        src="https://experience.arcgis.com/experience/e444a62bd78e417292dcc66910450bdf?draft=true&org=GaiaSpatial"
        allow="geolocation"
        title="Aplicación Perros del Barrio"
        allowfullscreen
      >
      </iframe>

    </div>

  </main>


  <script src="/Perros_del_Barrio/js/paw-menu.js"></script>

</body>

</html>
