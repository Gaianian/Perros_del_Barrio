<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Perros del Barrio</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.PNG"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/Perros_del_Barrio/css/style.css"
  >

  <meta
    property="og:title"
    content="Perros del Barrio"
  >

  <meta
    property="og:description"
    content="Explora, encuentre y reporte perros comunitarios en Cuenca."
  >

  <meta
    property="og:image"
    content="https://gaianian.github.io/Perros_del_Barrio/Preview.PNG"
  >

  <meta
    property="og:image:width"
    content="1200"
  >

  <meta
    property="og:image:height"
    content="630"
  >

  <meta
    property="og:url"
    content="https://gaianian.github.io/Perros_del_Barrio/"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    name="description"
    content="Encuentre y reporte perros comunitarios en Cuenca."
  >
</head>


<body>

  <header class="site-header">

    <!-- LEFT: TITLE + TAGLINE -->

    <div class="header-text">

      <h1>
        Perros del Barrio
      </h1>

      <p>
        Explora, encuentre y reporte <br>
        perros comunitarios en Cuenca
      </p>

    </div>


    <!-- RIGHT: PAW MENU -->

    <nav
      class="site-menu"
      aria-label="Menú principal"
    >

      <div
        class="paw-menu"
        id="pawMenu"
      >

        <svg
          class="paw-menu-svg"
          viewBox="0 0 360 320"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Menú principal"
        >

          <!-- =========================
               LABEL PATHS
               Each path wraps its own toe
               ========================= -->

          <defs>

            <!-- CÓMO USAR -->
            <path
              id="comoPath"
              d="M77 106
                 A32 44 0 0 1 141 106"
            />

            <!-- PARTICIPA -->
            <path
              id="participaPath"
              d="M220 106
                 A32 44 0 0 1 284 106"
            />

            <!-- REPORTAR -->
            <path
              id="reportarPath"
              d="M34 177
                 A31 43 -30 0 1 88 149"
            />

            <!-- AVISTAMIENTO -->
            <path
              id="avistamientoPath"
              d="M27 190
                 A37 50 -30 0 1 96 154"
            />

            <!-- SOBRE -->
            <path
              id="sobrePath"
              d="M272 149
                 A31 43 30 0 1 326 177"
            />

            <!-- NOSOTROS -->
            <path
              id="nosotrosPath"
              d="M264 154
                 A37 50 30 0 1 333 190"
            />

            <!-- INICIO UNDER PAW -->
            <path
              id="inicioPath"
              d="M119 278
                 Q180 304 241 278"
            />

          </defs>


          <!-- =========================
               CÓMO USAR
               ========================= -->

          <a
            href="#"
            class="paw-item paw-como"
            aria-label="Cómo usar"
          >

            <g class="toe">

              <ellipse
                cx="109"
                cy="118"
                rx="28"
                ry="39"
              />

              <text class="toe-label">

                <textPath
                  href="#comoPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Cómo usar
                </textPath>

              </text>

            </g>

          </a>


          <!-- =========================
               PARTICIPA
               ========================= -->

          <a
            href="#"
            class="paw-item paw-participa"
            aria-label="Participa"
          >

            <g class="toe">

              <ellipse
                cx="252"
                cy="118"
                rx="28"
                ry="39"
              />

              <text class="toe-label">

                <textPath
                  href="#participaPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Participa
                </textPath>

              </text>

            </g>

          </a>


          <!-- =========================
               REPORTAR AVISTAMIENTO
               ========================= -->

          <a
            href="#"
            class="paw-item paw-reportar"
            aria-label="Reportar avistamiento"
          >

            <g class="toe">

              <ellipse
                cx="66"
                cy="183"
                rx="26"
                ry="37"
                transform="rotate(-30 66 183)"
              />

              <text class="toe-label">

                <textPath
                  href="#reportarPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Reportar
                </textPath>

              </text>

              <text class="toe-label">

                <textPath
                  href="#avistamientoPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  avistamiento
                </textPath>

              </text>

            </g>

          </a>


          <!-- =========================
               SOBRE NOSOTROS
               ========================= -->

          <a
            href="#"
            class="paw-item paw-sobre"
            aria-label="Sobre nosotros"
          >

            <g class="toe">

              <ellipse
                cx="294"
                cy="183"
                rx="26"
                ry="37"
                transform="rotate(30 294 183)"
              />

              <text class="toe-label">

                <textPath
                  href="#sobrePath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Sobre
                </textPath>

              </text>

              <text class="toe-label">

                <textPath
                  href="#nosotrosPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  nosotros
                </textPath>

              </text>

            </g>

          </a>


          <!-- =========================
               MAIN PAW PAD
               FIXED SIZE
               ========================= -->

          <g
            class="paw-center"
            id="pawMenuButton"
            role="button"
            tabindex="0"
            aria-expanded="false"
            aria-label="Abrir menú"
          >

            <path
              d="
                M111 235
                C112 193 133 160 157 148
                C171 141 191 141 205 148
                C229 160 250 193 251 235
                C252 260 234 274 212 268
                C193 263 169 263 150 268
                C128 274 110 260 111 235
                Z
              "
            />

            <!-- curved menu lines -->

            <g class="paw-lines">

              <path
                d="M151 195
                   Q181 185 211 195"
              />

              <path
                d="M147 211
                   Q181 200 215 211"
              />

              <path
                d="M152 227
                   Q181 218 210 227"
              />

            </g>

          </g>


          <!-- =========================
               INICIO OUTSIDE / UNDER PAW
               ========================= -->

          <text
            class="paw-home-label"
          >

            <textPath
              href="#inicioPath"
              startOffset="50%"
              text-anchor="middle"
            >
              Inicio
            </textPath>

          </text>

        </svg>

      </div>

    </nav>

  </header>


  <main class="app-container">

    <iframe
      src="https://experience.arcgis.com/experience/e444a62bd78e417292dcc66910450bdf?draft=true&org=GaiaSpatial"
      allow="geolocation"
      title="Aplicación Perros del Barrio"
      allowfullscreen
    >
    </iframe>

  </main>


  <script src="/Perros_del_Barrio/js/paw-menu.js"></script>

</body>

</html>
