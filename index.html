<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Perros del Barrio</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.PNG"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/Perros_del_Barrio/css/style.css"
  >


  <!-- Facebook / social preview -->

  <meta
    property="og:title"
    content="Perros del Barrio"
  >

  <meta
    property="og:description"
    content="Explora, encuentre y reporte <br>perros comunitarios en Cuenca."
  >

  <meta
    property="og:image"
    content="https://gaianian.github.io/Perros_del_Barrio/Preview.PNG"
  >

  <meta
    property="og:image:width"
    content="1200"
  >

  <meta
    property="og:image:height"
    content="630"
  >

  <meta
    property="og:url"
    content="https://gaianian.github.io/Perros_del_Barrio/"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    name="description"
    content="Encuentre y reporte perros comunitarios en Cuenca."
  >

</head>


<body>


  <!-- =========================
       HEADER
       ========================= -->

  <header class="site-header">


    <!-- Logo -->

    <div class="logo-area">

      <img
        src="images/Logo.png"
        alt="Logo de Perros del Barrio"
        class="logo"
      >

    </div>


    <!-- Title and existing tagline -->

    <div class="header-text">

      <h1>
        Perros del Barrio
      </h1>

      <p>
        Explora, encuentre y reporte <br>
        perros comunitarios en Cuenca
      </p>

    </div>



    <!-- =========================
         PAW MENU
         ========================= -->

    <nav
      class="site-menu"
      aria-label="Menú principal"
    >

      <div
        class="paw-menu"
        id="pawMenu"
      >

        <svg
          class="paw-menu-svg"
          viewBox="0 0 260 250"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="false"
        >


          <!-- HOME TOE -->

          <a
            class="paw-item paw-home"
            href="#"
            aria-label="Home"
          >

            <g class="toe">

              <ellipse
                cx="88"
                cy="78"
                rx="24"
                ry="32"
              />

              <text
                x="88"
                y="31"
              >
                Home
              </text>

            </g>

          </a>



          <!-- JOIN US TOE -->

          <a
            class="paw-item paw-join"
            href="#"
            aria-label="Join Us"
          >

            <g class="toe">

              <ellipse
                cx="170"
                cy="78"
                rx="24"
                ry="32"
              />

              <text
                x="170"
                y="31"
              >
                Join Us
              </text>

            </g>

          </a>



          <!-- HOW TO USE APP TOE -->

          <a
            class="paw-item paw-help"
            href="#"
            aria-label="How to use the app"
          >

            <g class="toe">

              <ellipse
                cx="47"
                cy="132"
                rx="22"
                ry="30"
                transform="rotate(-28 47 132)"
              />

              <text
                x="38"
                y="183"
                class="paw-label-small"
              >
                How to use
              </text>

            </g>

          </a>



          <!-- ACERCA DE TOE -->

          <a
            class="paw-item paw-about"
            href="#"
            aria-label="Acerca de"
          >

            <g class="toe">

              <ellipse
                cx="213"
                cy="132"
                rx="22"
                ry="30"
                transform="rotate(28 213 132)"
              />

              <text
                x="220"
                y="183"
              >
                Acerca de
              </text>

            </g>

          </a>



          <!-- =========================
               MAIN PAW PAD
               ========================= -->

          <g
            class="paw-center"
            id="pawMenuButton"
            role="button"
            tabindex="0"
            aria-expanded="false"
            aria-label="Abrir menú"
          >


            <!-- Main paw pad -->

            <path
              d="
                M75 194
                C76 163 92 137 110 127
                C120 122 140 122 150 127
                C168 137 184 163 185 194
                C186 214 171 224 153 220
                C137 216 123 216 107 220
                C89 224 74 214 75 194
                Z
              "
            />


            <!-- Three small menu lines -->

            <g class="paw-lines">

              <line
                x1="114"
                y1="168"
                x2="146"
                y2="168"
              />

              <line
                x1="114"
                y1="180"
                x2="146"
                y2="180"
              />

              <line
                x1="114"
                y1="192"
                x2="146"
                y2="192"
              />

            </g>


          </g>


        </svg>

      </div>

    </nav>


  </header>



  <!-- =========================
       ARCGIS APPLICATION
       ========================= -->

  <main class="app-container">

    <iframe
      src="https://experience.arcgis.com/experience/e444a62bd78e417292dcc66910450bdf?draft=true&org=GaiaSpatial"
      allow="geolocation"
      title="Aplicación Perros del Barrio"
      allowfullscreen
    >
    </iframe>

  </main>



  <!-- Paw menu behavior -->

  <script src="/Perros_del_Barrio/js/paw-menu.js"></script>


</body>

</html>
