<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Perros del Barrio</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.PNG"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/Perros_del_Barrio/css/style.css"
  >

  <meta
    property="og:title"
    content="Perros del Barrio"
  >

  <meta
    property="og:description"
    content="Explora, encuentra y reporta perros comunitarios en Cuenca."
  >

  <meta
    property="og:image"
    content="https://gaianian.github.io/Perros_del_Barrio/Preview.PNG"
  >

  <meta
    property="og:image:width"
    content="1200"
  >

  <meta
    property="og:image:height"
    content="630"
  >

  <meta
    property="og:url"
    content="https://gaianian.github.io/Perros_del_Barrio/"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    name="description"
    content="Explora, encuentra y reporta perros comunitarios en Cuenca."
  >
</head>


<body>

  <header class="site-header">

    <!-- ======================================
         TITLE + TAGLINE
         ====================================== -->

    <div class="header-text">

      <h1>
        Perros del Barrio
      </h1>

      <p>
        Explora, encuentra y reporta
        <br>
        perros comunitarios en Cuenca
      </p>

    </div>


    <!-- ======================================
         PAW MENU
         ====================================== -->

    <nav
      class="site-menu"
      aria-label="Menú principal"
    >

      <div
        class="paw-menu"
        id="pawMenu"
      >

        <svg
          class="paw-menu-svg"
          viewBox="0 0 360 340"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Menú principal"
        >

          <defs>

            <!-- CÓMO USAR -->

            <path
              id="comoPath"
              d="
                M99 91
                Q135 51 171 91
              "
            />


            <!-- PARTICIPA -->

            <path
              id="participaPath"
              d="
                M189 91
                Q225 51 261 91
              "
            />


            <!-- REPORTAR -->

            <path
              id="reportarPath"
              d="
                M29 151
                Q59 111 94 131
              "
            />


            <!-- AVISTAMIENTO -->

            <path
              id="avistamientoPath"
              d="
                M11 181
                Q55 108 108 138
              "
            />


            <!-- SOBRE -->

            <path
              id="sobrePath"
              d="
                M266 131
                Q301 111 331 151
              "
            />


            <!-- NOSOTROS -->

            <path
              id="nosotrosPath"
              d="
                M252 138
                Q305 108 349 181
              "
            />


            <!-- INICIO UNDER PAW -->

            <path
              id="inicioPath"
              d="
                M111 292
                Q180 335 249 292
              "
            />

          </defs>


          <!-- ======================================
               CÓMO USAR
               ====================================== -->

          <a
            href="#"
            class="paw-item paw-como"
            aria-label="Cómo usar"
          >

            <g class="toe">

              <ellipse
                cx="135"
                cy="116"
                rx="30"
                ry="42"
                transform="rotate(-12 135 116)"
              />

              <text class="toe-label">

                <textPath
                  href="#comoPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Cómo usar
                </textPath>

              </text>

            </g>

          </a>


          <!-- ======================================
               PARTICIPA
               ====================================== -->

          <a
            href="#"
            class="paw-item paw-participa"
            aria-label="Participa"
          >

            <g class="toe">

              <ellipse
                cx="225"
                cy="116"
                rx="30"
                ry="42"
                transform="rotate(12 225 116)"
              />

              <text class="toe-label">

                <textPath
                  href="#participaPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Participa
                </textPath>

              </text>

            </g>

          </a>


          <!-- ======================================
               REPORTAR AVISTAMIENTO
               ====================================== -->

          <a
            href="#"
            class="paw-item paw-reportar"
            aria-label="Reportar avistamiento"
          >

            <g class="toe">

              <ellipse
                cx="70"
                cy="171"
                rx="29"
                ry="41"
                transform="rotate(-40 70 171)"
              />

              <text class="toe-label">

                <textPath
                  href="#reportarPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Reportar
                </textPath>

              </text>

              <text class="toe-label">

                <textPath
                  href="#avistamientoPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  avistamiento
                </textPath>

              </text>

            </g>

          </a>


          <!-- ======================================
               SOBRE NOSOTROS
               ====================================== -->

          <a
            href="#"
            class="paw-item paw-sobre"
            aria-label="Sobre nosotros"
          >

            <g class="toe">

              <ellipse
                cx="290"
                cy="171"
                rx="29"
                ry="41"
                transform="rotate(40 290 171)"
              />

              <text class="toe-label">

                <textPath
                  href="#sobrePath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Sobre
                </textPath>

              </text>

              <text class="toe-label">

                <textPath
                  href="#nosotrosPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  nosotros
                </textPath>

              </text>

            </g>

          </a>


          <!-- ======================================
               MAIN PAW PAD
               ====================================== -->

          <g
            class="paw-center"
            id="pawMenuButton"
            role="button"
            tabindex="0"
            aria-expanded="false"
            aria-label="Abrir menú"
          >

            <path
              d="
                M98 244
                C99 197 124 161 152 148
                C168 140 192 140 208 148
                C236 161 261 197 262 244
                C263 273 241 287 216 280
                C194 274 166 274 144 280
                C119 287 97 273 98 244
                Z
              "
            />

            <g class="paw-lines">

              <path
                d="
                  M143 196
                  Q180 183 217 196
                "
              />

              <path
                d="
                  M138 215
                  Q180 200 222 215
                "
              />

              <path
                d="
                  M145 234
                  Q180 222 215 234
                "
              />

            </g>

          </g>


          <!-- ======================================
               INICIO
               ====================================== -->

          <a
            href="index.html"
            class="paw-home-link"
            aria-label="Inicio"
          >

            <text class="paw-home-label">

              <textPath
                href="#inicioPath"
                startOffset="50%"
                text-anchor="middle"
              >
                Inicio
              </textPath>

            </text>

          </a>

        </svg>

      </div>

    </nav>

  </header>


  <!-- ======================================
       EXPERIENCE BUILDER APP
       ====================================== -->

  <main class="app-container">

    <div class="app-wrapper">

      <!--
        Website-level visual cue for the filter
        that exists inside the ArcGIS Experience Builder app.

        The cue itself does not control the ArcGIS filter.
        It simply makes the existing control easier to notice.
      -->

      <div
        class="filter-cue"
        id="filterCue"
        aria-hidden="true"
      >

        <span class="filter-cue-label">
          Filtrar perros
        </span>

        <span class="filter-cue-arrow">
          ↓
        </span>

      </div>


      <iframe
        src="https://experience.arcgis.com/experience/e444a62bd78e417292dcc66910450bdf?draft=true&org=GaiaSpatial"
        allow="geolocation"
        title="Aplicación Perros del Barrio"
        allowfullscreen
      >
      </iframe>

    </div>

  </main>


  <!-- ======================================
       JAVASCRIPT
       ====================================== -->

  <script src="/Perros_del_Barrio/js/paw-menu.js"></script>

</body>

</html>
