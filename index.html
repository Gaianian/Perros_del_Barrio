<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Perros del Barrio</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.PNG"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/Perros_del_Barrio/css/style.css"
  >

  <meta
    property="og:title"
    content="Perros del Barrio"
  >

  <meta
    property="og:description"
    content="Explora, encuentra y reporta perros comunitarios en Cuenca."
  >

  <meta
    property="og:image"
    content="https://gaianian.github.io/Perros_del_Barrio/Preview.PNG"
  >

  <meta
    property="og:image:width"
    content="1200"
  >

  <meta
    property="og:image:height"
    content="630"
  >

  <meta
    property="og:url"
    content="https://gaianian.github.io/Perros_del_Barrio/"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    name="description"
    content="Explora, encuentra y reporta perros comunitarios en Cuenca."
  >
</head>


<body>

  <header class="site-header">

    <!-- =========================================
         TITLE
         ========================================= -->

    <h1 class="site-title">
      Perros del Barrio
    </h1>


    <!-- =========================================
         TAGLINE
         ========================================= -->

    <div class="header-tagline">

      <p>
        Explora, encuentra y reporta
        <br>
        perros comunitarios en Cuenca
      </p>

    </div>


    <!-- =========================================
         PAW MENU
         ========================================= -->

    <nav
      class="site-menu"
      aria-label="Menú principal"
    >

      <div
        class="paw-menu"
        id="pawMenu"
      >

        <svg
          class="paw-menu-svg"
          viewBox="0 0 360 340"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Menú principal"
        >


          <!-- =====================================
               AYUDA
               hover: CÓMO USAR
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-ayuda"
            aria-label="Cómo usar"
          >

            <g class="toe">

              <ellipse
                cx="135"
                cy="116"
                rx="30"
                ry="42"
                transform="rotate(-12 135 116)"
              />

              <text
                class="toe-word"
                x="135"
                y="67"
                text-anchor="middle"
              >
                Ayuda
              </text>

              <text
                class="toe-hover-word"
                x="135"
                y="67"
                text-anchor="middle"
              >
                Cómo usar
              </text>

            </g>

          </a>


          <!-- =====================================
               PARTICIPA
               hover: PARTICIPA AQUÍ
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-participa"
            aria-label="Participa aquí"
          >

            <g class="toe">

              <ellipse
                cx="225"
                cy="116"
                rx="30"
                ry="42"
                transform="rotate(12 225 116)"
              />

              <text
                class="toe-word"
                x="225"
                y="67"
                text-anchor="middle"
              >
                Participa
              </text>

              <text
                class="toe-hover-word"
                x="225"
                y="67"
                text-anchor="middle"
              >
                Participa aquí
              </text>

            </g>

          </a>


          <!-- =====================================
               REPORTA
               hover: REPORTAR PERRO
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-reporta"
            aria-label="Reportar perro"
          >

            <g class="toe">

              <ellipse
                cx="70"
                cy="171"
                rx="29"
                ry="41"
                transform="rotate(-40 70 171)"
              />

              <text
                class="toe-word toe-word-side-left"
                x="34"
                y="120"
                text-anchor="middle"
              >
                Reporta
              </text>

              <text
                class="toe-hover-word toe-hover-left"
                x="29"
                y="118"
                text-anchor="middle"
              >
                Reportar perro
              </text>

            </g>

          </a>


          <!-- =====================================
               NOSOTROS
               hover: SOBRE NOSOTROS
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-nosotros"
            aria-label="Sobre nosotros"
          >

            <g class="toe">

              <ellipse
                cx="290"
                cy="171"
                rx="29"
                ry="41"
                transform="rotate(40 290 171)"
              />

              <text
                class="toe-word toe-word-side-right"
                x="326"
                y="120"
                text-anchor="middle"
              >
                Nosotros
              </text>

              <text
                class="toe-hover-word toe-hover-right"
                x="331"
                y="118"
                text-anchor="middle"
              >
                Sobre nosotros
              </text>

            </g>

          </a>


          <!-- =====================================
               MAIN PAW PAD
               ===================================== -->

          <g
            class="paw-center"
            id="pawMenuButton"
            role="button"
            tabindex="0"
            aria-expanded="false"
            aria-label="Abrir menú"
          >

            <path
              d="
                M98 244
                C99 197 124 161 152 148
                C168 140 192 140 208 148
                C236 161 261 197 262 244
                C263 273 241 287 216 280
                C194 274 166 274 144 280
                C119 287 97 273 98 244
                Z
              "
            />

            <g class="paw-lines">

              <path
                d="
                  M143 196
                  Q180 183 217 196
                "
              />

              <path
                d="
                  M138 215
                  Q180 200 222 215
                "
              />

              <path
                d="
                  M145 234
                  Q180 222 215 234
                "
              />

            </g>

          </g>


          <!-- =====================================
               INICIO
               ===================================== -->

          <a
            href="index.html"
            class="paw-home-link"
            aria-label="Inicio"
          >

            <text
              class="paw-home-label"
              x="180"
              y="318"
              text-anchor="middle"
            >
              Inicio
            </text>

          </a>

        </svg>

      </div>

    </nav>

  </header>


  <!-- =========================================
       ARCGIS APPLICATION
       ========================================= -->

  <main class="app-container">

    <div class="app-wrapper">

      <!-- Original solid filter cue -->

      <div
        class="filter-cue"
        aria-hidden="true"
      >

        <span class="filter-cue-label">
          Filtrar perros
        </span>

        <span class="filter-cue-arrow">
          ↓
        </span>

      </div>


      <iframe
        src="https://experience.arcgis.com/experience/e444a62bd78e417292dcc66910450bdf?draft=true&org=GaiaSpatial"
        allow="geolocation"
        title="Aplicación Perros del Barrio"
        allowfullscreen
      >
      </iframe>

    </div>

  </main>


  <script src="/Perros_del_Barrio/js/paw-menu.js"></script>

</body>

</html>
