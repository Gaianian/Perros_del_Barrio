<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Perros del Barrio</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.PNG"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/Perros_del_Barrio/css/style.css"
  >

  <!-- Facebook / social preview -->

  <meta property="og:title" content="Perros del Barrio">

  <meta
    property="og:description"
    content="Explora, encuentre y reporte perros comunitarios en Cuenca."
  >

  <meta
    property="og:image"
    content="https://gaianian.github.io/Perros_del_Barrio/Preview.PNG"
  >

  <meta property="og:image:width" content="1200">

  <meta property="og:image:height" content="630">

  <meta
    property="og:url"
    content="https://gaianian.github.io/Perros_del_Barrio/"
  >

  <meta property="og:type" content="website">

  <meta
    name="description"
    content="Encuentre y reporte perros comunitarios en Cuenca."
  >
</head>


<body>

  <header class="site-header">

    <!-- LOGO -->

    <div class="logo-area">
      <img
        src="images/Logo.png"
        alt="Logo de Perros del Barrio"
        class="logo"
      >
    </div>


    <!-- TITLE + TAGLINE -->

    <div class="header-text">
      <h1>Perros del Barrio</h1>

      <p>
        Explora, encuentre y reporte <br>
        perros comunitarios en Cuenca
      </p>
    </div>


    <!-- PAW MENU -->

    <nav
      class="site-menu"
      aria-label="Menú principal"
    >

      <div
        class="paw-menu"
        id="pawMenu"
      >

        <svg
          class="paw-menu-svg"
          viewBox="0 0 320 300"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Menú principal"
        >

          <!-- ===================================
               CURVED LABEL PATHS
               each one wraps its own toe
               =================================== -->

          <defs>

            <!-- top-left toe -->
            <path
              id="comoPath"
              d="M68 101
                 A31 42 0 0 1 130 101"
            />

            <!-- top-right toe -->
            <path
              id="participaPath"
              d="M185 101
                 A31 42 0 0 1 247 101"
            />

            <!-- lower-left toe: first line -->
            <path
              id="reportarPath"
              d="M29 153
                 A29 40 -28 0 1 80 127"
            />

            <!-- lower-left toe: second line -->
            <path
              id="avistamientoPath"
              d="M24 164
                 A34 46 -28 0 1 86 132"
            />

            <!-- lower-right toe: first line -->
            <path
              id="sobrePath"
              d="M240 127
                 A29 40 28 0 1 291 153"
            />

            <!-- lower-right toe: second line -->
            <path
              id="nosotrosPath"
              d="M234 132
                 A34 46 28 0 1 296 164"
            />

          </defs>


          <!-- ===================================
               CÓMO USAR
               =================================== -->

          <a
            href="#"
            class="paw-item paw-como"
            aria-label="Cómo usar"
          >

            <g class="toe">

              <ellipse
                cx="99"
                cy="110"
                rx="27"
                ry="37"
              />

              <text class="toe-label">
                <textPath
                  href="#comoPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Cómo usar
                </textPath>
              </text>

            </g>

          </a>


          <!-- ===================================
               PARTICIPA
               =================================== -->

          <a
            href="#"
            class="paw-item paw-participa"
            aria-label="Participa"
          >

            <g class="toe">

              <ellipse
                cx="216"
                cy="110"
                rx="27"
                ry="37"
              />

              <text class="toe-label">
                <textPath
                  href="#participaPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Participa
                </textPath>
              </text>

            </g>

          </a>


          <!-- ===================================
               REPORTAR AVISTAMIENTO
               =================================== -->

          <a
            href="#"
            class="paw-item paw-reportar"
            aria-label="Reportar avistamiento"
          >

            <g class="toe">

              <ellipse
                cx="56"
                cy="168"
                rx="25"
                ry="35"
                transform="rotate(-28 56 168)"
              />

              <text class="toe-label">
                <textPath
                  href="#reportarPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Reportar
                </textPath>
              </text>

              <text class="toe-label">
                <textPath
                  href="#avistamientoPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  avistamiento
                </textPath>
              </text>

            </g>

          </a>


          <!-- ===================================
               SOBRE NOSOTROS
               =================================== -->

          <a
            href="#"
            class="paw-item paw-sobre"
            aria-label="Sobre nosotros"
          >

            <g class="toe">

              <ellipse
                cx="264"
                cy="168"
                rx="25"
                ry="35"
                transform="rotate(28 264 168)"
              />

              <text class="toe-label">
                <textPath
                  href="#sobrePath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Sobre
                </textPath>
              </text>

              <text class="toe-label">
                <textPath
                  href="#nosotrosPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  nosotros
                </textPath>
              </text>

            </g>

          </a>


          <!-- ===================================
               MAIN PAW PAD
               =================================== -->

          <g
            class="paw-center"
            id="pawMenuButton"
            role="button"
            tabindex="0"
            aria-expanded="false"
            aria-label="Abrir menú"
          >

            <path
              d="
                M91 229
                C92 192 110 162 133 151
                C146 145 173 145 187 151
                C210 162 228 192 229 229
                C230 253 212 265 191 260
                C172 255 148 255 129 260
                C108 265 90 253 91 229
                Z
              "
            />

            <!-- curved menu marks -->

            <g class="paw-lines">
              <path d="M137 193 Q160 185 183 193" />
              <path d="M133 207 Q160 198 187 207" />
              <path d="M138 221 Q160 214 182 221" />
            </g>

            <!-- INICIO -->

            <text
              class="paw-home-label"
              x="160"
              y="248"
            >
              Inicio
            </text>

          </g>

        </svg>

      </div>

    </nav>

  </header>


  <!-- ARCGIS APPLICATION -->

  <main class="app-container">

    <iframe
      src="https://experience.arcgis.com/experience/e444a62bd78e417292dcc66910450bdf?draft=true&org=GaiaSpatial"
      allow="geolocation"
      title="Aplicación Perros del Barrio"
      allowfullscreen
    >
    </iframe>

  </main>


  <script src="/Perros_del_Barrio/js/paw-menu.js"></script>

</body>

</html>
