<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Perros del Barrio</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.PNG"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/Perros_del_Barrio/css/style.css"
  >

  <meta
    property="og:title"
    content="Perros del Barrio"
  >

  <meta
    property="og:description"
    content="Explora, encuentra y reporta perros comunitarios en Cuenca."
  >

  <meta
    property="og:image"
    content="https://gaianian.github.io/Perros_del_Barrio/Preview.PNG"
  >

  <meta
    property="og:image:width"
    content="1200"
  >

  <meta
    property="og:image:height"
    content="630"
  >

  <meta
    property="og:url"
    content="https://gaianian.github.io/Perros_del_Barrio/"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    name="description"
    content="Explora, encuentra y reporta perros comunitarios en Cuenca."
  >
</head>


<body>

  <header class="site-header">

    <!-- =========================================
         TAGLINE — LEFT, VERTICALLY CENTERED
         ========================================= -->

    <div class="header-tagline">

      <p>
        Explora, encuentra y reporta
        <br>
        perros comunitarios en Cuenca
      </p>

    </div>


    <!-- =========================================
         TITLE — CENTERED BOTH WAYS
         ========================================= -->

    <h1 class="site-title">
      Perros del Barrio
    </h1>


    <!-- =========================================
         PAW MENU — RIGHT, VERTICALLY CENTERED
         ========================================= -->

    <nav
      class="site-menu"
      aria-label="Menú principal"
    >

      <div
        class="paw-menu"
        id="pawMenu"
      >

        <svg
          class="paw-menu-svg"
          viewBox="0 0 360 340"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Menú principal"
        >

          <defs>

            <!-- Curved text paths located INSIDE toes -->

            <path
              id="ayudaPath"
              d="
                M101 122
                Q135 89 169 122
              "
            />

            <path
              id="participaPath"
              d="
                M191 122
                Q225 89 259 122
              "
            />

            <path
              id="reportaPath"
              d="
                M37 176
                Q69 141 101 168
              "
            />

            <path
              id="nosotrosPath"
              d="
                M259 168
                Q291 141 323 176
              "
            />

          </defs>


          <!-- =====================================
               AYUDA
               HOVER: CÓMO / USAR
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-ayuda"
            aria-label="Cómo usar"
          >

            <g class="toe">

              <circle
                cx="135"
                cy="120"
                r="41"
              />

              <!-- Normal curved label -->

              <text class="toe-word">

                <textPath
                  href="#ayudaPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Ayuda
                </textPath>

              </text>


              <!-- Hover label -->

              <g class="toe-hover-word">

                <text
                  x="135"
                  y="116"
                  text-anchor="middle"
                >
                  Cómo
                </text>

                <text
                  x="135"
                  y="138"
                  text-anchor="middle"
                >
                  usar
                </text>

              </g>

            </g>

          </a>


          <!-- =====================================
               PARTICIPA
               HOVER: PARTICIPA / AQUÍ
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-participa"
            aria-label="Participa aquí"
          >

            <g class="toe">

              <circle
                cx="225"
                cy="120"
                r="41"
              />

              <!-- Normal curved label -->

              <text class="toe-word">

                <textPath
                  href="#participaPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Participa
                </textPath>

              </text>


              <!-- Hover label -->

              <g class="toe-hover-word">

                <text
                  x="225"
                  y="116"
                  text-anchor="middle"
                >
                  Participa
                </text>

                <text
                  x="225"
                  y="138"
                  text-anchor="middle"
                >
                  aquí
                </text>

              </g>

            </g>

          </a>


          <!-- =====================================
               REPORTA
               HOVER: REPORTAR / PERRO
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-reporta"
            aria-label="Reportar perro"
          >

            <g class="toe">

              <circle
                cx="70"
                cy="181"
                r="41"
              />

              <!-- Normal curved label -->

              <text class="toe-word">

                <textPath
                  href="#reportaPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Reporta
                </textPath>

              </text>


              <!-- Hover label -->

              <g class="toe-hover-word">

                <text
                  x="70"
                  y="177"
                  text-anchor="middle"
                >
                  Reportar
                </text>

                <text
                  x="70"
                  y="199"
                  text-anchor="middle"
                >
                  perro
                </text>

              </g>

            </g>

          </a>


          <!-- =====================================
               NOSOTROS
               HOVER: SOBRE / NOSOTROS
               ===================================== -->

          <a
            href="#"
            class="paw-item paw-nosotros"
            aria-label="Sobre nosotros"
          >

            <g class="toe">

              <circle
                cx="290"
                cy="181"
                r="41"
              />

              <!-- Normal curved label -->

              <text class="toe-word">

                <textPath
                  href="#nosotrosPath"
                  startOffset="50%"
                  text-anchor="middle"
                >
                  Nosotros
                </textPath>

              </text>


              <!-- Hover label -->

              <g class="toe-hover-word">

                <text
                  x="290"
                  y="177"
                  text-anchor="middle"
                >
                  Sobre
                </text>

                <text
                  x="290"
                  y="199"
                  text-anchor="middle"
                >
                  nosotros
                </text>

              </g>

            </g>

          </a>


          <!-- =====================================
               MAIN PAW PAD
               ===================================== -->

          <g
            class="paw-center"
            id="pawMenuButton"
            role="button"
            tabindex="0"
            aria-expanded="false"
            aria-label="Abrir menú"
          >

            <path
              d="
                M98 244
                C99 197 124 161 152 148
                C168 140 192 140 208 148
                C236 161 261 197 262 244
                C263 273 241 287 216 280
                C194 274 166 274 144 280
                C119 287 97 273 98 244
                Z
              "
            />

            <g class="paw-lines">

              <path
                d="
                  M143 194
                  Q180 181 217 194
                "
              />

              <path
                d="
                  M138 213
                  Q180 198 222 213
                "
              />

              <path
                d="
                  M145 232
                  Q180 220 215 232
                "
              />

            </g>


            <!-- INICIO REMAINS VISIBLE
                 WHEN OPEN AND CLOSED -->

            <text
              class="paw-home-label"
              x="180"
              y="264"
              text-anchor="middle"
            >
              Inicio
            </text>

          </g>

        </svg>

      </div>

    </nav>

  </header>


  <!-- =========================================
       ARCGIS APPLICATION
       ========================================= -->

  <main class="app-container">

    <div class="app-wrapper">

      <!-- Solid website-level filter cue -->

      <div
        class="filter-cue"
        aria-hidden="true"
      >

        <span class="filter-cue-label">
          Filtrar perros
        </span>

        <span class="filter-cue-arrow">
          ↓
        </span>

      </div>


      <iframe
        src="https://experience.arcgis.com/experience/e444a62bd78e417292dcc66910450bdf?draft=true&org=GaiaSpatial"
        allow="geolocation"
        title="Aplicación Perros del Barrio"
        allowfullscreen
      >
      </iframe>

    </div>

  </main>


  <script src="/Perros_del_Barrio/js/paw-menu.js"></script>

</body>

</html>
